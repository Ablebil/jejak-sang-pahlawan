<style>
:root { --paper:#f5f0e6; --card:#fffcf5; --sunken:#ece5d5; --line:#d9cfb9; --ink:#2a2520; --muted:#6a6155; --brick:#9b3d2c; }
html { scroll-behavior:smooth; }
body { font-family:'Plus Jakarta Sans',sans-serif; color:var(--ink); background:var(--paper); min-height:100vh; font-size:16px; line-height:1.55; }
button, .btn { user-select:none; -webkit-tap-highlight-color:transparent; cursor:pointer; }
:focus-visible { outline:2px solid var(--brick); outline-offset:2px; border-radius:8px; }
h1,h2,h3,h4 { font-family:'Lora',Georgia,serif; letter-spacing:0; }

/* ===== Surfaces ===== */
.glass { background:var(--card); border:1px solid var(--line); box-shadow:0 1px 2px rgba(60,45,20,.06); }
.glass-soft { background:var(--sunken); border:1px solid var(--line); }
.gold-gradient-text { color:var(--brick); }
.btn-gold { background:var(--brick); color:#fffcf5; font-weight:700; transition:background .15s; }
.btn-gold:hover { background:#82301f; }
.btn-ghost { background:var(--card); border:1px solid var(--line); color:var(--ink); font-weight:600; transition:all .15s; }
.btn-ghost:hover { border-color:var(--brick); color:var(--brick); }
.custom-scrollbar::-webkit-scrollbar, body::-webkit-scrollbar { width:10px; height:10px; }
.custom-scrollbar::-webkit-scrollbar-track, body::-webkit-scrollbar-track { background:var(--sunken); }
.custom-scrollbar::-webkit-scrollbar-thumb, body::-webkit-scrollbar-thumb { background:#c6baa0; border-radius:8px; }
.eyebrow { font-size:.75rem; letter-spacing:.08em; font-weight:700; text-transform:uppercase; color:var(--muted); }
.ornament { height:1px; background:var(--line); }

/* ===== Motion (kept minimal) ===== */
@keyframes fadeUp { from { opacity:0; transform:translateY(8px) } to { opacity:1; transform:none } }
@keyframes pop { from { opacity:0; transform:scale(.98) } to { opacity:1; transform:none } }
@keyframes shake { 0%,100% { transform:translateX(0) } 25%,75% { transform:translateX(-5px) } 50% { transform:translateX(5px) } }
@keyframes drawLine { from { stroke-dashoffset:1 } to { stroke-dashoffset:0 } }
@keyframes confettiFall { to { transform:translateY(110vh) rotate(540deg); opacity:.9 } }
@keyframes toastIn { from { opacity:0; transform:translateY(-6px) } to { opacity:1; transform:none } }
.fade-up { animation:fadeUp .35s ease both; }
.pop { animation:pop .2s ease both; }
.shake { animation:shake .3s; }
.floaty, .spin-slow { animation:none; }
.stagger > * { animation:fadeUp .4s ease both; }
.stagger > *:nth-child(2){animation-delay:.05s}.stagger > *:nth-child(3){animation-delay:.1s}.stagger > *:nth-child(4){animation-delay:.15s}.stagger > *:nth-child(5){animation-delay:.2s}.stagger > *:nth-child(n+6){animation-delay:.25s}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; scroll-behavior:auto !important; } }

/* ===== Quiz options ===== */
.opt { width:100%; text-align:left; padding:.8rem 1rem; border-radius:.75rem; border:1.5px solid var(--line); background:var(--card); color:var(--ink); transition:border-color .15s, background .15s; display:flex; align-items:center; justify-content:space-between; gap:.75rem; }
.opt:hover:not([disabled]) { border-color:var(--brick); background:#faf3ea; }
.opt[disabled] { cursor:default; }
.opt-right { border-color:#4d7c63 !important; background:#e4eee6 !important; color:#1f4a37 !important; font-weight:600; }
.opt-wrong { border-color:#b4493c !important; background:#f5e1dc !important; color:#6e2b22 !important; font-weight:600; animation:shake .3s; }
.opt-dim { opacity:.6; }
.opt .letter { background:var(--sunken) !important; border-color:var(--line) !important; color:var(--muted); }

/* ===== Hero cards & photos ===== */
.photo-frame { position:relative; overflow:hidden; background:var(--sunken); }
.photo-frame img { width:100%; height:100%; object-fit:cover; object-position:center 15%; transition:transform .4s ease; }
.hero-card { transition:border-color .2s, box-shadow .2s; background:var(--card); }
.hero-card:hover { border-color:var(--brick); box-shadow:0 6px 18px -8px rgba(60,45,20,.35); }
.hero-card:hover .photo-frame img { transform:scale(1.04); }
.gold-ring { box-shadow:0 0 0 1px var(--line); }

/* ===== Map ===== */
.route-line { fill:none; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; }
.route-line.anim { stroke-dasharray:1; stroke-dashoffset:1; animation:drawLine var(--dur,6s) linear var(--delay,0s) forwards; }
.route-line.dashed { stroke-dasharray:2 7; stroke-width:2.4; }
.map-label { font-size:11px; font-weight:700; fill:#2a2520; paint-order:stroke; stroke:#f5f0e6; stroke-width:3.5px; stroke-linejoin:round; pointer-events:none; }
.sea-label { font-size:12px; font-style:italic; letter-spacing:.2em; fill:rgba(60,90,120,.5); pointer-events:none; text-transform:uppercase; }
.marker { cursor:pointer; }
.marker:hover circle.dot { r:8; }
.marker .ring { display:none; }

.tl-line { background:var(--line); }

/* ===== Toast & confetti ===== */
#toast-wrap { position:fixed; top:4.5rem; right:1rem; z-index:80; display:flex; flex-direction:column; gap:.5rem; pointer-events:none; }
.toast { background:var(--ink); color:#fffcf5; font-weight:600; padding:.5rem 1rem; border-radius:.6rem; box-shadow:0 8px 20px -8px rgba(0,0,0,.35); animation:toastIn .25s ease both; font-size:.85rem; }
.confetti { position:fixed; top:-20px; width:8px; height:12px; z-index:90; pointer-events:none; animation:confettiFall linear forwards; }
#modal-box { animation:pop .2s ease both; }

/* ===== Certificate ===== */
.cert { background:#fffcf5; color:#2a2520; border:10px double #9b3d2c; position:relative; box-shadow:0 10px 30px -12px rgba(60,45,20,.35); -webkit-print-color-adjust:exact; print-color-adjust:exact; }
.cert h2, .cert h3 { color:#2a2520; }
@media print {
  @page { size:A4 landscape; margin:8mm; }
  body { background:#fff !important; }
  body * { visibility:hidden !important; }
  #cert, #cert * { visibility:visible !important; }
  #cert { position:fixed; inset:0; margin:0 !important; max-width:none !important; box-shadow:none !important; }
}

/* ===== Misc ===== */
.progress-track { background:var(--sunken); border-radius:99px; overflow:hidden; }
.progress-fill { background:var(--brick); height:100%; border-radius:99px; transition:width .5s ease; }
.chip { padding:.4rem .9rem; border-radius:999px; font-size:.82rem; font-weight:600; border:1px solid var(--line); color:var(--ink); background:var(--card); transition:all .15s; cursor:pointer; }
.chip:hover { border-color:var(--brick); color:var(--brick); }
.chip.active { background:var(--brick); color:#fffcf5; border-color:var(--brick); }
.flip { perspective:900px; }
.flip-inner { position:relative; transition:transform .5s; transform-style:preserve-3d; }
.flip.flipped .flip-inner { transform:rotateY(180deg); }
.flip-face { backface-visibility:hidden; -webkit-backface-visibility:hidden; }
.flip-back { position:absolute; inset:0; transform:rotateY(180deg); }
.slot { min-height:3rem; border:1.5px dashed #bfb39a; border-radius:.75rem; transition:all .2s; }
.slot.filled { border-style:solid; border-color:#4d7c63; background:#e4eee6; }
.match-item { transition:all .15s; }
.match-item.sel { border-color:var(--brick) !important; background:#f6e9e1 !important; }
.match-item.done { border-color:#4d7c63 !important; background:#e4eee6 !important; opacity:.8; pointer-events:none; }
.text-xs { font-size:.8125rem !important; line-height:1.3rem !important; }
.text-\[11px\], .text-\[10px\] { font-size:.75rem !important; }
.text-sm { font-size:.95rem !important; line-height:1.55rem !important; }
.code { display:inline-flex; align-items:center; justify-content:center; font-weight:700; font-size:.75rem; letter-spacing:.05em; border-radius:.5rem; }
</style>
</head>

/* ---------- Sound ---------- */
let AC;
function tone(freqs, dur = .12) {
  if (!S.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    freqs.forEach((f, i) => {
      const t0 = AC.currentTime + i * dur, o = AC.createOscillator(), g = AC.createGain();
      o.type = 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(.14, t0 + .02); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
      o.connect(g).connect(AC.destination); o.start(t0); o.stop(t0 + dur + .03);
    });
  } catch(e) {}
}
const sfx = { ok:() => tone([523, 784]), bad:() => tone([196, 147], .16), win:() => tone([523, 659, 784, 1047], .13), tap:() => tone([660], .05) };
function toggleSound() { S.sound = !S.sound; save(); updateHud(); if (S.sound) sfx.tap(); }

/* ---------- Points / HUD ---------- */
function toast(msg) {
  const w = $('#toast-wrap'), t = document.createElement('div');
  t.className = 'toast'; t.innerHTML = msg; w.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity .3s'; setTimeout(() => t.remove(), 300); }, 1800);
}
function award(key, pts, silent) {           // one-time points per key
  if (S.awarded[key]) return 0;
  S.awarded[key] = true; S.score += pts; save(); updateHud();
  if (!silent) toast(`+${pts} poin`);
  return pts;
}
function awardBest(key, value) {              // only the improvement over previous best
  const diff = Math.max(0, value - (S.best[key] || 0));
  if (value > (S.best[key] || 0)) S.best[key] = value;
  if (diff) { S.score += diff; toast(`+${diff} poin`); }
  save(); updateHud(); return diff;
}
function updateHud() {
  const p = currentPage();
  const show = p !== 'home';
  $('#hud').classList.toggle('hidden', !show); $('#hud').classList.toggle('flex', show);
  $('#hud-progress').classList.toggle('hidden', !show);
  $('#hud-name').textContent = playerName();
  $('#hud-score').textContent = S.score;
  $('#hud-badges').textContent = `${doneCount()}/5`;
  $('#hud-progress-fill').style.width = `${doneCount() * 20}%`;
  $('#btn-sound').innerHTML = `<i class="fa-solid ${S.sound ? 'fa-volume-high' : 'fa-volume-xmark'}"></i>`;
}

function confetti(n = 70) {
  const colors = ['#a67c2e', '#a67c2e', '#a8483a', '#3f7a5a', '#3f6a9e', '#6b4f8a', '#fde68a'];
  for (let i = 0; i < n; i++) {
    const c = document.createElement('div'); c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw'; c.style.background = colors[i % colors.length];
    c.style.animationDuration = (2.2 + Math.random() * 2.2) + 's'; c.style.animationDelay = Math.random() * .6 + 's';
    c.style.transform = `rotate(${Math.random() * 360}deg)`; c.style.borderRadius = Math.random() > .5 ? '50%' : '2px';
    document.body.appendChild(c); setTimeout(() => c.remove(), 5500);
  }
}

function revealOptions(ans, chosen) {
  [...$('#opts').children].forEach((b, i) => {

    if (i === ans) { b.classList.add('opt-right'); b.querySelector('.mark').innerHTML = '<i class="fa-solid fa-circle-check text-emerald-400 text-lg"></i>'; }

    else b.classList.add('opt-dim');

}
function answerQ(idx) {
  if (Q.locked) return; Q.locked = true;
  const q = Q.qs[Q.i], ok = idx === q.ans;
  revealOptions(q.ans, idx);
  if (ok) { Q.correct++; sfx.ok(); award(`mq${Q.n}_${Q.i}`, 20); } else sfx.bad();
  const last = Q.i === Q.qs.length - 1, fb = $('#q-fb');
  fb.className = `p-4 rounded-2xl border text-sm ${ok ? 'border-emerald-500/40 bg-emerald-950/50 text-emerald-100' : 'border-rose-500/40 bg-rose-950/50 text-rose-100'}`;

function nextQ() {

/* =====================================================================

   ===================================================================== */
const GAME_META = [
  { n:1, t:'Tebak Negara Penjajah', d:'Cocokkan peristiwa & tokoh dengan bangsa Eropa yang tepat.', i:'fa-flag', c:'#3f7a5a' },
  { n:2, t:'Susun Jalur Ekspedisi', d:'Urutkan jalur pelayaran dan kronologi sejarah dengan benar.', i:'fa-route', c:'#3f6a9e' },
  { n:3, t:'Siapa Aku?', d:'Tebak pahlawan dari foto yang buram dan petunjuk biografi.', i:'fa-mask', c:'#6b4f8a' },
  { n:4, t:'Pasangkan Jejak Sejarah', d:'Hubungkan pahlawan dengan warisan dan jasanya.', i:'fa-link', c:'#a67c2e' }
];
function renderGames(st) {
  st.innerHTML = wrap(`
    ${pageHeader('Mini Games Sejarah', 'Arena Tantangan Edukasi Interaktif', '#3f7a5a')}
    <p class="text-sm text-slate-300 mb-5 max-w-2xl">Kumpulkan skor setinggi mungkin (maksimal 100 per game). Poin hanya bertambah saat kamu memecahkan skor terbaikmu sendiri.</p>
    <div class="grid sm:grid-cols-2 gap-4 stagger">${GAME_META.map(g => { const b = S.best['g' + g.n] || 0; return `
      <button onclick="go('game${g.n}')" class="text-left glass rounded-2xl p-5 flex items-center gap-4 hover:border-gold-400 transition group">
        <div class="font-header text-5xl font-bold w-12 text-center shrink-0" style="color:${g.c}">${g.n}</div>
        <div class="flex-1"><div class="eyebrow" style="color:${g.c}">Game ${g.n}</div><h3 class="font-header text-lg font-bold">${g.t}</h3><p class="text-xs text-slate-400 mt-1">${g.d}</p>
          <div class="mt-2 flex items-center gap-2 text-xs"><div class="progress-track h-1.5 flex-1"><div class="progress-fill" style="width:${b}%"></div></div><span class="font-bold text-gold-400">${b}/100</span></div></div></button>`; }).join('')}</div>`);
}
let G = null;
function startGame(n) { G = { n, round:0, score:0, mistakes:0, locked:false }; ({ 1:g1Init, 2:g2Init, 3:g3Init, 4:g4Init })[n](); }
function gameShell(inner, sub = '') {
  const m = GAME_META[G.n - 1];
  $('#stage').innerHTML = wrap(`
    <div class="max-w-3xl mx-auto">
      <div class="flex items-center justify-between mb-4"><button onclick="go('games')" class="btn-ghost px-4 py-2 rounded-xl text-sm"><i class="fa-solid fa-arrow-left mr-1.5"></i>Arena</button>
        <div class="text-right"><div class="eyebrow" style="color:${m.c}">Game ${G.n}</div><div class="font-header font-bold">${m.t}</div></div></div>
      ${sub}<div class="glass rounded-2xl p-5 sm:p-7 pop">${inner}</div></div>`);
}
const gameBar = (i, total, extra = '') => `<div class="flex items-center gap-3 mb-4 text-sm"><span class="text-slate-400 whitespace-nowrap">${i}/${total}</span><div class="progress-track h-2 flex-1"><div class="progress-fill" style="width:${(i - 1) / total * 100}%"></div></div><span class="text-gold-400 font-bold whitespace-nowrap">${G.score}</span>${extra}</div>`;
function gameResult(score, total, extra = '') {
  const pct = Math.round(score / total * 100), gain = awardBest('g' + G.n, pct), m = GAME_META[G.n - 1];
  const emoji = pct >= 85 ? '' : pct >= 60 ? '' : '';
  if (pct >= 60) { sfx.win(); confetti(pct >= 85 ? 90 : 40); } else sfx.bad();
  $('#stage').innerHTML = wrap(`<div class="max-w-xl mx-auto glass rounded-2xl p-8 text-center space-y-4 pop">
    <h3 class="font-header text-3xl font-bold text-gold-400">Game Selesai</h3>
    <div class="text-6xl font-bold text-gold-400">${pct}<span class="text-2xl text-slate-400">/100</span></div>
    <p class="text-slate-300 text-sm">${pct >= 85 ? 'Luar biasa! Kamu menguasai materi ini.' : pct >= 60 ? 'Bagus! Sedikit lagi untuk skor sempurna.' : 'Ayo pelajari lagi materinya lalu coba kembali.'}</p>
    ${extra}${gain ? `<div class="inline-block bg-gold-500/15 border border-line rounded-full px-4 py-1.5 text-sm text-slate-300 font-bold">+${gain} poin (rekor baru!)</div>` : `<div class="text-xs text-slate-500">Skor terbaikmu: ${S.best['g' + G.n]}/100</div>`}
    <div class="flex flex-wrap justify-center gap-3 pt-2"><button onclick="startGame(${G.n})" class="btn-gold px-5 py-3 rounded-xl"><i class="fa-solid fa-rotate-right mr-1.5"></i>Main Lagi</button>
    <button onclick="go('games')" class="btn-ghost px-5 py-3 rounded-xl">Game Lain</button></div></div>`);
}

/* ---- Game 1: Tebak Negara ---- */
function g1Init() { G.qs = shuffle(GAME1_BANK).slice(0, 6); g1Render(); }
function g1Render() {
  const q = G.qs[G.round]; G.locked = false;
  gameShell(`${gameBar(G.round + 1, G.qs.length)}
    <p class="text-lg sm:text-xl font-bold leading-relaxed mb-5">${esc(q.q)}</p>
    <div class="grid grid-cols-2 gap-3" id="g1-opts">${NATIONS.map(n => `<button onclick="g1Answer('${n.id}')" data-id="${n.id}" class="opt !justify-center !text-center flex-col !gap-1 py-4"><span class="code w-11 h-8" style="background:${n.color}22;color:${n.color}">${n.flag}</span><span class="font-bold">${n.name}</span></button>`).join('')}</div>
    <div id="g-fb" class="mt-4"></div>`);
}
function g1Answer(id) {
  if (G.locked) return; G.locked = true;
  const q = G.qs[G.round], ok = id === q.a;
  if (ok) { G.score++; sfx.ok(); } else sfx.bad();
  $('#g1-opts').querySelectorAll('button').forEach(b => { b.disabled = true; if (b.dataset.id === q.a) b.classList.add('opt-right'); else if (b.dataset.id === id) b.classList.add('opt-wrong'); else b.classList.add('opt-dim'); });
  $('#g-fb').innerHTML = `<div class="p-4 rounded-2xl border text-sm ${ok ? 'border-emerald-500/40 bg-emerald-950/50 text-emerald-100' : 'border-rose-500/40 bg-rose-950/50 text-rose-100'}"><strong>${ok ? 'Benar!' : 'Kurang tepat.'}</strong> ${esc(q.why)}
    <div class="text-right mt-3"><button onclick="g1Next()" class="btn-gold px-5 py-2 rounded-xl text-sm">${G.round === G.qs.length - 1 ? 'Lihat Hasil' : 'Lanjut'} <i class="fa-solid fa-arrow-right ml-1"></i></button></div></div>`;
}
function g1Next() { G.round++; if (G.round >= G.qs.length) gameResult(G.score, G.qs.length); else g1Render(); }

/* ---- Game 2: Susun Jalur ---- */
function g2Init() { G.rounds = GAME2_ROUNDS; g2Render(); }
function g2Render() {
  const r = G.rounds[G.round]; G.locked = false; G.next = 0; G.m = 0; G.chips = shuffle(r.items.map((t, i) => ({ t, i })));
  if (G.chips.every((c, i) => c.i === i)) G.chips.reverse();
  gameShell(`${gameBar(G.round + 1, G.rounds.length)}
    <h3 class="font-header text-xl font-bold text-gold-400">${r.title}</h3><p class="text-sm text-slate-400 mb-4">${r.hint}. Ketuk kotak di bawah <strong>sesuai urutan</strong> dari awal sampai akhir.</p>
    <div class="space-y-2 mb-5" id="g2-slots">${r.items.map((_, i) => `<div class="slot flex items-center gap-3 px-3 text-sm" id="slot-${i}"><span class="w-7 h-7 rounded-full bg-navy-950 border border-slate-600 flex items-center justify-center text-xs font-bold text-slate-400">${i + 1}</span><span class="text-slate-600">…</span></div>`).join('')}</div>
    <div class="flex flex-wrap gap-2" id="g2-chips">${G.chips.map(c => `<button class="chip !text-sm !py-2 !px-4" id="chip-${c.i}" onclick="g2Pick(${c.i})">${esc(c.t)}</button>`).join('')}</div>
    <div id="g-fb" class="mt-4"></div>`);
}
function g2Pick(i) {
  if (G.locked) return;
  const r = G.rounds[G.round], chip = $('#chip-' + i);
  if (i === G.next) {
    sfx.ok(); const s = $('#slot-' + i); s.classList.add('filled'); s.innerHTML = `<span class="w-7 h-7 rounded-full bg-emerald-500 text-navy-950 flex items-center justify-center text-xs font-bold"><i class="fa-solid fa-check"></i></span><span class="font-semibold">${esc(r.items[i])}</span>`;
    chip.style.display = 'none'; G.next++;
    if (G.next === r.items.length) {
      G.locked = true; const pts = Math.max(5, 20 - G.m * 5); G.score += pts;
      $('#g-fb').innerHTML = `<div class="p-4 rounded-2xl border border-emerald-500/40 bg-emerald-950/50 text-emerald-100 text-sm"><strong>Urutan tepat!</strong> +${pts} poin ${G.m ? `(${G.m} kali salah)` : '(sempurna!)'}
        <div class="text-right mt-3"><button onclick="g2Next()" class="btn-gold px-5 py-2 rounded-xl text-sm">${G.round === G.rounds.length - 1 ? 'Lihat Hasil' : 'Babak Berikutnya'} <i class="fa-solid fa-arrow-right ml-1"></i></button></div></div>`;
    }
  } else { sfx.bad(); G.m++; chip.classList.remove('shake'); void chip.offsetWidth; chip.classList.add('shake'); chip.style.borderColor = '#a8483a'; setTimeout(() => chip.style.borderColor = '', 500); }
}
function g2Next() { G.round++; if (G.round >= G.rounds.length) gameResult(G.score, G.rounds.length * 20); else g2Render(); }

/* ---- Game 3: Siapa Aku? ---- */
function g3Init() { G.heroes = shuffle(HEROES).slice(0, 6); g3Render(); }
function g3Render() {
  const h = G.heroes[G.round]; G.locked = false; G.clues = 1;
  const opts = shuffle([h, ...shuffle(HEROES.filter(x => x.id !== h.id)).slice(0, 3)]);
  G.opts = opts;
  gameShell(`${gameBar(G.round + 1, G.heroes.length)}
    <div class="grid sm:grid-cols-5 gap-5 items-start">
      <div class="sm:col-span-2"><div class="photo-frame rounded-2xl aspect-[4/5] gold-ring" id="g3-photo">${heroImg(h, '', 'filter:blur(18px) grayscale(1);transform:scale(1.15)')}</div></div>
      <div class="sm:col-span-3">
        <div class="eyebrow mb-2">Petunjuk</div><ol id="g3-clues" class="space-y-2 text-sm"></ol>
        <button id="g3-more" onclick="g3MoreClue()" class="btn-ghost px-4 py-2 rounded-xl text-sm mt-3">Minta petunjuk lagi (−10 poin)</button>
        <div class="text-xs text-slate-500 mt-2">Poin soal ini: <strong id="g3-pts" class="text-gold-400">30</strong></div></div></div>
    <div class="grid grid-cols-2 gap-3 mt-5" id="g3-opts">${opts.map(o => `<button class="opt !text-sm" data-id="${o.id}" onclick="g3Answer(${o.id})"><span>${o.short}</span></button>`).join('')}</div>
    <div id="g-fb" class="mt-4"></div>`);
  g3DrawClues();
}
function g3Blur() { return [18, 10, 4][G.clues - 1]; }
function g3DrawClues() {
  const h = G.heroes[G.round];
  $('#g3-clues').innerHTML = h.clues.slice(0, G.clues).map((c, i) => `<li class="pop flex gap-2 rounded-xl bg-navy-950/80 border border-slate-700 p-3"><span class="text-gold-400 font-bold">${i + 1}.</span><span class="text-slate-200">${esc(c)}</span></li>`).join('');
  const img = $('#g3-photo img'); if (img && !G.locked) img.style.filter = `blur(${g3Blur()}px) grayscale(${G.clues === 1 ? 1 : G.clues === 2 ? .6 : .3}) brightness(.9)`;
  $('#g3-pts').textContent = 30 - (G.clues - 1) * 10;
  $('#g3-more').style.display = G.clues >= h.clues.length ? 'none' : '';
}
function g3MoreClue() { if (G.locked || G.clues >= 3) return; G.clues++; sfx.tap(); g3DrawClues(); }
function g3Answer(id) {
  if (G.locked) return; G.locked = true;
  const h = G.heroes[G.round], ok = id === h.id, pts = ok ? 30 - (G.clues - 1) * 10 : 0;
  if (ok) { G.score += pts; sfx.ok(); } else sfx.bad();
  $('#g3-opts').querySelectorAll('button').forEach(b => { b.disabled = true; const bid = +b.dataset.id; if (bid === h.id) b.classList.add('opt-right'); else if (bid === id) b.classList.add('opt-wrong'); else b.classList.add('opt-dim'); });
  const img = $('#g3-photo img'); img.style.transition = 'filter .6s, transform .6s'; img.style.filter = 'sepia(.15)'; img.style.transform = 'scale(1)';
  $('#g3-more').style.display = 'none';
  $('#g-fb').innerHTML = `<div class="p-4 rounded-2xl border text-sm ${ok ? 'border-emerald-500/40 bg-emerald-950/50 text-emerald-100' : 'border-rose-500/40 bg-rose-950/50 text-rose-100'}"><strong>${ok ? `Benar! +${pts} poin` : 'Belum tepat.'}</strong> Ia adalah <strong>${h.name}</strong> — ${h.form}.
    <div class="text-right mt-3"><button onclick="g3Next()" class="btn-gold px-5 py-2 rounded-xl text-sm">${G.round === G.heroes.length - 1 ? 'Lihat Hasil' : 'Lanjut'} <i class="fa-solid fa-arrow-right ml-1"></i></button></div></div>`;
}
function g3Next() { G.round++; if (G.round >= G.heroes.length) gameResult(G.score, G.heroes.length * 30); else g3Render(); }

/* ---- Game 4: Pasangkan ---- */
function g4Init() {
  G.pairs = shuffle(HEROES.filter(h => h.legacy)).slice(0, 6); G.left = shuffle(G.pairs); G.right = shuffle(G.pairs);
  G.sel = null; G.done = 0; G.mistakes = 0; g4Render();
}
function g4Render() {
  gameShell(`<div class="flex items-center justify-between text-sm mb-4"><span class="text-slate-400"><strong id="g4-done" class="text-gold-400">${G.done}</strong>/${G.pairs.length} pasangan</span><span class="text-slate-400">Salah: <strong id="g4-miss" class="text-rose-400">${G.mistakes}</strong></span></div>
    <p class="text-sm text-slate-300 mb-4">Ketuk <strong>pahlawan</strong>, lalu ketuk <strong>jasa/warisan</strong> yang cocok.</p>
    <div class="grid grid-cols-2 gap-3 sm:gap-5">
      <div class="space-y-2.5">${G.left.map(h => `<button class="match-item w-full flex items-center gap-3 rounded-2xl border-2 border-slate-700 bg-navy-950 p-2 text-left hover:border-gold-500" id="L${h.id}" onclick="g4Pick('L',${h.id})"><span class="w-12 h-12 shrink-0 rounded-xl overflow-hidden photo-frame">${heroImg(h)}</span><span class="text-xs sm:text-sm font-bold leading-tight">${h.short}</span></button>`).join('')}</div>
      <div class="space-y-2.5">${G.right.map(h => `<button class="match-item w-full flex items-center rounded-2xl border-2 border-slate-700 bg-navy-950 p-3 text-left text-xs sm:text-sm hover:border-gold-500 min-h-[4.25rem]" id="R${h.id}" onclick="g4Pick('R',${h.id})">${esc(h.legacy)}</button>`).join('')}</div></div>`);
}
function g4Pick(side, id) {
  const el = $('#' + side + id); if (el.classList.contains('done')) return; sfx.tap();
  if (!G.sel) { G.sel = { side, id }; el.classList.add('sel'); return; }
  if (G.sel.side === side) { $('#' + G.sel.side + G.sel.id).classList.remove('sel'); G.sel = (G.sel.id === id) ? null : { side, id }; if (G.sel) el.classList.add('sel'); return; }
  const a = G.sel; G.sel = null; $('#' + a.side + a.id).classList.remove('sel');
  if (a.id === id) {
    sfx.ok(); ['L', 'R'].forEach(s => { const e = $('#' + s + id); e.classList.add('done'); }); G.done++; $('#g4-done').textContent = G.done;
    if (G.done === G.pairs.length) setTimeout(() => gameResult(Math.max(10, 60 - G.mistakes * 10), 60), 700);
  } else {
    sfx.bad(); G.mistakes++; $('#g4-miss').textContent = G.mistakes;
    [$('#' + a.side + a.id), el].forEach(e => { e.classList.remove('shake'); void e.offsetWidth; e.classList.add('shake'); e.style.borderColor = '#a8483a'; setTimeout(() => e.style.borderColor = '', 500); });
  }
}

/* =====================================================================
   EVALUASI AKHIR
   ===================================================================== */
let EV = { stage:'intro', i:0, answers:[] };
function renderEval() {
  EV = { stage:'intro', i:0, answers:new Array(quizQuestions.length).fill(null) };
  const pending = MISSIONS.filter(m => !S.done[m.id]);
  $('#stage').innerHTML = wrap(`<div class="max-w-2xl mx-auto glass rounded-2xl p-6 sm:p-9 text-center space-y-5 pop">
    <div><span class="eyebrow">Evaluasi Akhir</span><h2 class="font-header text-3xl font-bold mt-1">Ujian Kemampuan Sejarah</h2></div>
    <p class="text-slate-300 text-sm leading-relaxed">${quizQuestions.length} soal pilihan ganda dari kelima misi. Setiap jawaban langsung disertai pembahasan. Nilai ≥ 70 membuktikan kamu seorang <strong class="text-gold-400">Penjelajah Cakap</strong>, dan sertifikat digital siap dicetak!</p>
    ${S.evalScore !== null ? `<div class="text-sm text-slate-400">Nilai terbaikmu saat ini: <strong class="text-gold-400 text-lg">${S.evalScore}</strong></div>` : ''}
    ${pending.length ? `<div class="rounded-xl bg-amber-500/10 border border-amber-500/30 p-3 text-xs text-amber-200 text-left">Saran: selesaikan dulu ${pending.map(m => 'Misi ' + m.n).join(', ')} agar lebih siap.</div>` : ''}
    <div class="flex flex-wrap justify-center gap-3"><button onclick="evStart()" class="btn-gold px-8 py-3.5 rounded-xl"><i class="fa-solid fa-play mr-2"></i>Mulai Evaluasi</button><button onclick="go('dashboard')" class="btn-ghost px-6 py-3.5 rounded-xl">Nanti Saja</button></div></div>`);
}
function evStart() { EV.stage = 'quiz'; EV.i = 0; evRender(); }
function evRender() {
  const q = quizQuestions[EV.i], sel = EV.answers[EV.i], isLast = EV.i === quizQuestions.length - 1;
  const answeredAll = EV.answers.every(a => a !== null);
  $('#stage').innerHTML = wrap(`<div class="max-w-3xl mx-auto">
    <div class="flex items-center justify-between mb-3"><span class="eyebrow">Evaluasi Akhir &bull; Soal ${EV.i + 1} dari ${quizQuestions.length}</span><span class="text-xs glass-soft px-3 py-1 rounded-full text-gold-400 font-bold">${S.score}</span></div>
    <div class="flex gap-1.5 mb-5 flex-wrap">${quizQuestions.map((_, i) => { const a = EV.answers[i]; const c = a === null ? 'bg-slate-700' : a === quizQuestions[i].answer ? 'bg-emerald-500' : 'bg-rose-500'; return `<button onclick="evJump(${i})" aria-label="Soal ${i + 1}" class="h-2.5 flex-1 min-w-[1rem] rounded-full ${c} ${i === EV.i ? 'ring-2 ring-gold-400 ring-offset-2 ring-offset-navy-900' : ''}"></button>`; }).join('')}</div>
    <div class="glass rounded-2xl p-5 sm:p-7 pop">
      <h3 class="font-bold text-lg sm:text-xl leading-relaxed mb-5">${EV.i + 1}. ${esc(q.q)}</h3>
      <div id="opts" class="space-y-2.5">${q.options.map((o, i) => `<button class="opt" onclick="evAnswer(${i})" ${sel !== null ? 'disabled' : ''}><span><span class="letter inline-flex w-7 h-7 mr-3 rounded-lg border items-center justify-center text-xs font-bold">${'ABCD'[i]}</span>${esc(o)}</span><span class="mark"></span></button>`).join('')}</div>
      <div id="ev-fb" class="mt-4">${sel !== null ? evFeedback(q, sel) : ''}</div>
    </div>
    <div class="flex items-center justify-between mt-5">
      <button onclick="evJump(${EV.i - 1})" class="text-sm text-slate-400 hover:text-gold-400 ${EV.i === 0 ? 'invisible' : ''}"><i class="fa-solid fa-arrow-left mr-1"></i>Sebelumnya</button>
      ${isLast || answeredAll ? `<button onclick="evFinish()" class="btn-gold px-6 py-3 rounded-xl ${answeredAll ? '' : 'opacity-60'}">Selesai & Lihat Hasil</button>` : ''}
      ${!isLast ? `<button onclick="evJump(${EV.i + 1})" class="${sel !== null ? 'btn-gold px-6 py-3 rounded-xl' : 'text-sm text-slate-400 hover:text-gold-400'}">Selanjutnya <i class="fa-solid fa-arrow-right ml-1"></i></button>` : ''}
    </div></div>`);
  if (sel !== null) revealOptions(q.answer, sel);
}
const evFeedback = (q, sel) => `<div class="p-4 rounded-2xl border text-sm ${sel === q.answer ? 'border-emerald-500/40 bg-emerald-950/50 text-emerald-100' : 'border-rose-500/40 bg-rose-950/50 text-rose-100'}"><strong>${sel === q.answer ? 'Benar!' : 'Belum tepat.'} Pembahasan:</strong> ${esc(q.explain)}</div>`;
function evJump(i) { if (i < 0 || i >= quizQuestions.length) return; EV.i = i; evRender(); window.scrollTo({ top:0 }); }
function evAnswer(idx) {
  if (EV.answers[EV.i] !== null) return;
  EV.answers[EV.i] = idx; const q = quizQuestions[EV.i];
  if (idx === q.answer) { sfx.ok(); award('ev_' + EV.i, 10); } else sfx.bad();
  evRender();
}
function evFinish() {
  const un = EV.answers.filter(a => a === null).length;
  if (un) { toast(`Masih ada ${un} soal belum dijawab`); const first = EV.answers.findIndex(a => a === null); evJump(first); return; }
  const correct = EV.answers.filter((a, i) => a === quizQuestions[i].answer).length, grade = Math.round(correct / quizQuestions.length * 100);
  if (S.evalScore === null || grade > S.evalScore) S.evalScore = grade; save();
  EV.stage = 'result'; EV.correct = correct; EV.grade = grade;
  const cat = grade >= 85 ? 'MAHIR' : grade >= 70 ? 'CAKAP' : grade >= 55 ? 'BERKEMBANG' : 'PERLU BIMBINGAN';
  if (grade >= 70) { sfx.win(); confetti(110); } else sfx.bad();
  const wrongs = quizQuestions.map((q, i) => ({ q, i, a:EV.answers[i] })).filter(x => x.a !== x.q.answer);
  $('#stage').innerHTML = wrap(`<div class="max-w-3xl mx-auto space-y-5">
    <div class="glass rounded-2xl p-7 text-center pop space-y-3">
      <span class="eyebrow">Hasil Evaluasi</span>
      <div class="text-7xl font-bold gold-gradient-text">${grade}</div>
      <div class="text-slate-300">${correct} dari ${quizQuestions.length} soal benar &bull; Kategori: <strong class="text-emerald-400">${cat}</strong></div>
      <div class="flex flex-wrap justify-center gap-3 pt-2"><button onclick="go('sertifikat')" class="btn-gold px-6 py-3 rounded-xl">Lihat Sertifikat</button>
        <button onclick="renderEval()" class="btn-ghost px-6 py-3 rounded-xl"><i class="fa-solid fa-rotate-right mr-1.5"></i>Ulangi</button><button onclick="go('dashboard')" class="btn-ghost px-6 py-3 rounded-xl">Menu Misi</button></div></div>
    ${wrongs.length ? `<div class="glass rounded-2xl p-5"><h3 class="font-header font-bold text-rose-300 mb-3">Pelajari Lagi (${wrongs.length} soal)</h3><div class="space-y-3">${wrongs.map(w => `<div class="rounded-2xl bg-navy-950/70 border border-slate-800 p-4 text-sm"><p class="font-semibold text-slate-100 mb-2">${w.i + 1}. ${esc(w.q.q)}</p><p class="text-rose-300 text-xs mb-1">Jawabanmu: ${esc(w.q.options[w.a])}</p><p class="text-emerald-300 text-xs mb-1">Jawaban benar: ${esc(w.q.options[w.q.answer])}</p><p class="text-slate-400 text-xs">${esc(w.q.explain)}</p></div>`).join('')}</div></div>` : '<div class="glass rounded-2xl p-5 text-center text-emerald-300 font-bold">Sempurna! Semua jawabanmu benar.</div>'}
  </div>`);
  window.scrollTo({ top:0 });
}

/* =====================================================================
   SERTIFIKAT
   ===================================================================== */
function renderCertificate(st) {
  if (S.evalScore === null) { toast('Kerjakan Evaluasi Akhir dulu ya'); go('evaluasi'); return; }
  const s = S.evalScore, cat = s >= 85 ? 'MAHIR (Penjelajah Utama)' : s >= 70 ? 'CAKAP (Penjelajah Unggul)' : s >= 55 ? 'BERKEMBANG' : 'PERLU BIMBINGAN';
  const date = new Date().toLocaleDateString('id-ID', { day:'numeric', month:'long', year:'numeric' });
  st.innerHTML = wrap(`
    <div class="max-w-4xl mx-auto">
      <div id="cert" class="cert rounded-xl p-6 sm:p-12 text-center fade-up">
        <div class="absolute top-5 left-6 text-3xl text-amber-700 opacity-80"></div><div class="absolute top-5 right-6 text-3xl text-amber-700 opacity-80"></div>
        <div class="text-xs font-bold tracking-[.35em] text-amber-800">SERTIFIKAT PENGHARGAAN SEJARAH</div>
        <h2 class="font-header text-3xl sm:text-5xl font-bold mt-2 tracking-wide" style="color:#9b3d2c">JEJAK SANG PAHLAWAN</h2>
        <div class="w-40 h-0.5 mx-auto my-4 bg-amber-700/50"></div>
        <p class="italic text-amber-900">Diberikan dengan bangga kepada Penjelajah Muda:</p>
        <h3 class="font-header text-3xl sm:text-5xl font-bold my-4 pb-2 border-b-2 border-amber-700/50 inline-block px-6 sm:px-12 break-words max-w-full">${esc(playerName())}</h3>
        <p class="max-w-2xl mx-auto leading-relaxed text-amber-950">telah menelusuri <strong>${doneCount()} dari 5 misi</strong> ekspedisi sejarah kedatangan bangsa Eropa, Politik Etis, dan perjuangan para pahlawan nasional Indonesia, dengan hasil evaluasi:</p>
        <div class="inline-flex flex-wrap items-center justify-center gap-6 mt-5 px-8 py-4 rounded-2xl border-2 border-amber-700/60 bg-amber-100/60">
          <div><div class="text-[10px] tracking-widest text-amber-800 font-bold">NILAI AKHIR</div><div class="font-header text-4xl font-bold text-amber-900">${s}<span class="text-lg">/100</span></div></div>
          <div class="hidden sm:block w-px h-12 bg-amber-700/40"></div>
          <div><div class="text-[10px] tracking-widest text-amber-800 font-bold">KATEGORI</div><div class="font-bold text-amber-900">${cat}</div></div>
          <div class="hidden sm:block w-px h-12 bg-amber-700/40"></div>
          <div><div class="text-[10px] tracking-widest text-amber-800 font-bold">POIN</div><div class="font-header text-2xl font-bold text-amber-900">${S.score}</div></div></div>
        <p class="mt-5 italic text-amber-900">"Teruslah meneladani semangat para pahlawan sebagai penerus cita-cita bangsa!"</p>
        <p class="mt-2 text-xs text-amber-800">${date} &bull; IPAS Kelas 6 SD / Fase C</p>
      </div>
      <div class="flex flex-wrap justify-center gap-3 mt-6">
        <button onclick="window.print()" class="btn-gold px-6 py-3 rounded-xl"><i class="fa-solid fa-print mr-1.5"></i>Cetak / Simpan PDF</button>
        <button onclick="go('evaluasi')" class="btn-ghost px-6 py-3 rounded-xl"><i class="fa-solid fa-rotate-right mr-1.5"></i>Perbaiki Nilai</button>
        <button onclick="go('dashboard')" class="btn-ghost px-6 py-3 rounded-xl">Menu Misi</button></div>
    </div>`);
}

/* ===== INIT ===== */
window.addEventListener('DOMContentLoaded', render);

</script>
</body>
